known_limitations:
  - 開發期幅度約每筆 0.5 bp，尚未通過扣成本（Jason 回報）；預檢情境為來回 1～3 bp（台指期約 16,000 點時一跳約 0.62 bp）。
  - spec v1 以 t 當根收盤價成交，偏樂觀；第二版改下一根成交，並測延遲 1～5 分鐘的敏感度。
  - 「最有機會的候選」從 27 個樣本內組合挑出，門檻用了全期資料，不是已驗證的規則；第二版改用滾動門檻重新檢定。
  - 驗證組（2024-01～2025-11-03，約 1.8 年，444 天）不滿 stat-ruleset 1.2 要求的封存窗 5 年；最後 242 天（2025-11-04～2026-11-04）已被探索讀過，不能當封存窗。
  - 單一市況：探索那一年是 AI 多頭行情，台積電主導，結論未必適用其他市況。
  - 盤中即時指數資料來源未解：凱基 API SDK 2.0.3 已停用即時指數訂閱、歷史分 K 查不到指數；證交所即時行情網頁能否穩定以程式抓取尚未驗證。拿不到則訊號不能實際交易。
  - 櫃買端沒有可交易期貨（櫃買期、富櫃 200 期幾乎沒有成交），只能把櫃買當訊號、用台指期下單。

# ---------------------------------------------------------------------
# 以下不是 preregistration/1 的欄位，是草稿的工作筆記；簽核複製時整段刪除。
# ---------------------------------------------------------------------
draft_notes:
  trial_accounting:
    source: Jason 第二則回覆（2026-11-05）；他稱已寫入試驗帳 registry/ledger（族 fin_otc_spread），本草稿未驗證
    counted_total: 70
    batches:
      - {id: exploration, n: 34, window: "2025-11-04～2026-11-04（242 天）", note: "2 種訊號 × 4 形式 × 4 預測目標 ＝ 32，加日頻 2 個"}
      - {id: dev_spec_v1, n: 9, window: "2020-03-23～2023-12-31（925 天）", note: "事先凍結的正式檢定，4 格通過"}
      - {id: dev_breakeven_precheck, n: 27, window: "同上，樣本內", note: "9 格 × 3 個進場分位門檻；『最有機會的候選』由此挑出"}
    disclosed_not_counted:
      - "拆兩腿（金融腿、櫃買腿）× 9 格 ＝ 18 次"
      - "依前 20 日波動度分三組 × 9 格 ＝ 27 次"
      - "標準誤改週群聚、月群聚、Newey-West：同一假設換算法，不算新試驗"
      - "探索期描述性檢查，及同一批 34 組合在 82、142、242 天各看過一次"
    conservative_total: 115         # 70 + 18 + 27，作為敏感度並列
    if_testing_otc_single_leg: 88   # 70 + 18：第二版若檢定櫃買單腿形式，至少這個數
    ruleset_note: >-
      stat-ruleset 1.2 對 selection 的 N 無條件累加。27 次樣本內挑選若依 1.2 的 lockbox 條件
      無法成立（沒有符合條件的封存窗），須改記 selection。這個口徑與 Jason 的 70（27 已計入）一致，
      但「27 次是 screening（ΔN=0）還是 selection」在他的登記裡如何分類，未驗證。
  lockbox_plan:
    requirement: stat-ruleset 1.2 lockbox_min_years = 5（resolver 不強制，由呼叫端負責）
    current: 驗證組約 1.8 年；最後 242 天已被讀過 → 不滿足（Jason 同意）
    decision_by_jason: 目前不處理；若第二版在開發期扣成本後仍有利潤，才回頭處理
    fallback: 櫃買中心 2014-02～2019-12 盤中資料（約 5.9 年，未下載、沒人看過），但在逐筆交易制度之前，推論要打折
    open: 「第二版開發期扣成本後仍有利潤」本身也是一次看結果的決定；它是否算一次 trial、是否改變開發期的可用性：TODO(人)
  decisions_needed:
    - id: D1
      question: 主假說押「金融／櫃買價差」還是「櫃買單腿」？（拆兩腿發現預測力全部來自櫃買腿）
      impact: 單腿 → 至少 88 次；價差 → 70 次，且主假說與已知發現不一致。
    - id: D2
      question: 主假說的 k、h、進場規則（滾動門檻的視窗長度與分位）。
      impact: 不得直接沿用「前 5%、30 分、持有 30 分」，那是從 27 個樣本內組合挑出的。
    - id: D3
      question: family 與 planned_trials 填什麼（bounded_multiple 或 best_of_M；70／88／115）。
      impact: 決定門檻（bounded_multiple n≥6 為 |t|≥3；best_of_M 為 DSR>0.95 且 PBO<0.5）。
    - id: D4
      question: 通過條件是否加入「扣成本後淨報酬 > 0」，以及成本數字怎麼定（手續費、滑價實測）。
    - id: D5
      question: 證偽條件。建議項（僅提案，不是已登記）：扣成本後淨報酬 ≤ 0；下一根成交下 t 未達門檻；延遲 1～5 分鐘任一情境方向翻轉；樣本外方向不一致。
    - id: D6
      question: 盤中即時指數來源（硬性前提）與資料如何進回測：tquant_future 沒有分 K 與指數。
    - id: D7
      question: 封存窗：何時處理、用 2014-02～2019-12 備案的話是否接受「逐筆制度前」打折。
