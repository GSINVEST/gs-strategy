id: ""                              # 簽核時填
title: 金融與櫃買指數的盤中價差，對之後台指期短線報酬的領先性（第二版：實際成本、下一根成交、滾動門檻）
author: ""                          # 簽核時填
registered_at: ""                   # 簽核時填
supersedes: null                    # TODO(人)：spec v1（9 組檢定）是否已登記成 preregistration、編號為何，本草稿未驗證
supersedes_reason: null

hypothesis: >-
  方向先押定：金融指數相對櫃買指數的過去 k 分鐘報酬價差擴大（金融相對強、櫃買相對弱）之後，
  之後 h 分鐘的台指期報酬為負。具體的 k、h、進場分位門檻、持有時間：TODO(人)
  # 來源 spec v1：k、h 各取 5／15／30 分鐘。Jason 的「最有機會候選」（k=30、h=30、極端前 5%）
  # 是從 27 個樣本內組合挑出，不能未經宣告就當主假說。

economic_mechanism: >-
  來源文件的說法：資金躲進金融股、離開上櫃小型股，通常代表市場轉弱。
  誰在另一邊持續虧錢：TODO(人)（答不出來就把 stat_plan.family 如實填成 open_mining 或 best_of_M）
  # Jason 回報：開發期拆兩腿後，預測力全部來自櫃買腿。也就是說機制可能是「小型股先轉弱」，
  # 而不是「金融與櫃買的相對價差」。主假說要押哪一個：TODO(人)

