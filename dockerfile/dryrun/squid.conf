http_port 3128

# 唯一放行的目的地：TEJ API（zipline-tej 匯入時取交易日曆、bundle 驗證用）。
# 要新增網域必須改這個檔並走 PR；券商、交易所網域一律不在名單內。
acl allowed_domains dstdomain api.tej.com.tw
acl tls_port port 443
acl connect_method method CONNECT

http_access allow connect_method tls_port allowed_domains
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /tmp/squid.pid
