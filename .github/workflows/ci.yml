name: ci

# pytest on every PR and every push to main.
#
# The synthetic futures graph equivalence test runs real Zipline without a key.
# Its fixture supplies only offline calendar input, never mocked accounting.
# Production bundle tests remain explicitly skipped without licensed data;
# the skipped-test summary below makes that coverage boundary visible.
# To enable licensed bundle coverage, add TEJAPI_KEY in repository Settings >
# Secrets and variables > Actions, then uncomment the Run pytest env mapping.
# Provision/ingest tquant_future in the runner's ZIPLINE_ROOT and set
# GS_TEST_REAL_BUNDLE=1 to enable the production graph equivalence test.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt -r requirements-bt.txt

      - name: Run pytest
        # env:
        #   TEJAPI_KEY: ${{ secrets.TEJAPI_KEY }}
        run: |
          pytest tests/ -q -rs --junit-xml=pytest-report.xml

      - name: Summarise skipped tests
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("pytest-report.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              print(f"no parsable report ({exc}); pytest likely died before writing one")
              raise SystemExit(0)

          suite = root if root.tag == "testsuite" else root.find("testsuite")
          totals = {k: suite.get(k, "0") for k in ("tests", "failures", "errors", "skipped")}
          lines = [
              "| metric | count |",
              "| --- | --- |",
              *(f"| {k} | {v} |" for k, v in totals.items()),
              "",
          ]

          skipped = [
              (case.get("classname", ""), case.get("name", ""),
               (skip.get("message") or "").strip().replace("\n", " "))
              for case in suite.iter("testcase")
              for skip in case.findall("skipped")
          ]
          if skipped:
              lines += ["### Skipped — not covered by this run", ""]
              lines += [f"- `{cls}::{name}` — {msg}" for cls, name, msg in skipped]
          else:
              lines += ["No tests were skipped."]

          body = "\n".join(lines)
          print(body)
          if summary := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(body + "\n")
          PY

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: warn
